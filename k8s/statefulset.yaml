apiVersion: apps/v1
i
kind: StatefulSet
metadata:
  name: web
  namespace: stateful-app

spec:
  serviceName: web-headless

  replicas: 1

  podManagementPolicy: OrderedReady

  updateStrategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: nginx
          image: nginx:1.27

          ports:
            - name: http
              containerPort: 80

          envFrom:
            - configMapRef:
                name: web-config

            - secretRef:
                name: web-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 15
            periodSeconds: 20

          volumeMounts:
            - name: web-data
              mountPath: /usr/share/nginx/html

  volumeClaimTemplates:

    - metadata:
        name: web-data

      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: auto-ebs-sc

        resources:
          requests:
            storage: 1Gi
